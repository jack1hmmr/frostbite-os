name: build-iso

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "archiso/**"
      - "calamares/**"
      - "docs/installer-acceptance.md"
      - "manifests/**"
      - "packaging/calamares-frostbite/**"
      - "scripts/**"
      - "themes/**"
      - ".github/workflows/build-iso.yml"
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "archiso/**"
      - "calamares/**"
      - "manifests/**"
      - "packaging/calamares-frostbite/**"
      - "scripts/**"
      - "themes/**"
      - ".github/workflows/build-iso.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install package and ISO build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            archiso base-devel cmake edk2-ovmf extra-cmake-modules git grub imagemagick \
            kcoreaddons kpmcore libpwquality mkinitcpio namcap ninja parted polkit \
            polkit-qt6 python python-yaml qemu-base qt6-base qt6-svg qt6-tools \
            squashfs-tools tesseract tesseract-data-eng xorriso yaml-cpp

      - name: Validate tree
        run: |
          ./scripts/lint-tree.sh
          ./scripts/validate-installer.py

      - name: Build pinned minimal Calamares package
        run: |
          useradd --create-home builder
          install -d -o builder -g builder \
            "$GITHUB_WORKSPACE/work/calamares-package" \
            "$GITHUB_WORKSPACE/work/packages"
          runuser --user builder -- ./scripts/build-calamares-package.sh

          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

          package_path="$(find work/packages -maxdepth 1 -type f -name 'calamares-frostbite-3.4.2-1-x86_64.pkg.tar.zst' -print -quit)"
          test -n "$package_path"
          test ! -L "$package_path"
          (cd work/packages && sha256sum --check "$(basename -- "$package_path").sha256")

          install -d -o root -g root -m 0755 "$GITHUB_WORKSPACE/work/verified-packages"
          install -o root -g root -m 0644 \
            "$package_path" \
            "$package_path.sha256" \
            "$package_path.BUILDINFO" \
            "$GITHUB_WORKSPACE/work/verified-packages/"

      - name: Build ISO
        run: |
          CALAMARES_PACKAGE_DIR="$GITHUB_WORKSPACE/work/verified-packages" ./scripts/build-iso.sh
          git diff --exit-code

      - name: Record build footprint and checksums
        env:
          BASELINE_ISO_BYTES: "1998891008"
        run: |
          package_path="$(find work/verified-packages -maxdepth 1 -type f -name 'calamares-frostbite-*.pkg.tar.zst' -print -quit)"
          iso_path="$(find out -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$package_path"
          test -n "$iso_path"
          iso_bytes="$(stat --format='%s' "$iso_path")"
          iso_delta="$((iso_bytes - BASELINE_ISO_BYTES))"
          mkdir -p out/build-metadata
          {
            printf 'baseline_iso_bytes=%s\n' "$BASELINE_ISO_BYTES"
            printf 'installer_iso_bytes=%s\n' "$iso_bytes"
            printf 'installer_iso_delta_bytes=%s\n' "$iso_delta"
            printf 'calamares_package_bytes=%s\n' "$(stat --format='%s' "$package_path")"
            pacman -Qip "$package_path"
          } | tee out/build-metadata/footprint.txt
          sha256sum "$iso_path" > out/build-metadata/iso.sha256
          cp "$package_path.sha256" "$package_path.BUILDINFO" out/build-metadata/

      - name: Debug initramfs contents
        run: |
          echo "--- mkinitcpio.d preset in airootfs ---"
          cat archiso/airootfs/etc/mkinitcpio.d/linux-zen.preset || echo "MISSING preset"
          echo "--- archiso.conf in airootfs ---"
          cat archiso/airootfs/etc/mkinitcpio.conf.d/archiso.conf || echo "MISSING archiso.conf"
          echo "--- searching for built initramfs ---"
          find work -iname "initramfs-linux-zen.img" -exec echo {} \; -exec lsinitcpio -l {} \; 2>&1 | head -100
          echo "--- searching pacstrap root for mkinitcpio-archiso package ---"
          find work -path "*pacstrap*etc/mkinitcpio.d*" -o -path "*pacstrap*etc/mkinitcpio.conf.d*" 2>&1 | head -20

      - name: Install, boot, and audit in a disposable UEFI VM
        run: |
          iso_path="$(find out -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$iso_path"
          FROSTBITE_VM_EVIDENCE_DIR="$GITHUB_WORKSPACE/out/vm-test-evidence" \
            ./scripts/test-installer-vm.sh "$iso_path"

      - name: Upload disposable VM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frostbite-installer-vm-evidence
          path: out/vm-test-evidence/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: frostbite-os-iso
          path: out/*.iso
          if-no-files-found: error

      - name: Upload package and footprint evidence
        uses: actions/upload-artifact@v4
        with:
          name: frostbite-installer-build-evidence
          path: |
            work/verified-packages/*.pkg.tar.zst
            out/build-metadata/**
          if-no-files-found: error
