set $mod Mod4
set $term foot
set $installer frostbite-installer

# The dedicated installer session is deliberately separate from the ordinary
# desktop. Do not add kill, reload, or compositor-exit bindings here: once
# Calamares begins partitioning, an accidental shortcut must not abort it.
xwayland force

output * bg #0a0a0c solid_color
font pango:Noto Sans 10

default_border pixel 2
client.focused #5b2a86 #0a0a0c #f2f2f2 #5b2a86 #5b2a86
client.unfocused #1a1a20 #0a0a0c #c9c9d1 #1a1a20 #1a1a20

# A terminal remains available for diagnosis. Super+I can retry the launcher
# after a pre-install error; the launcher refuses to create a second instance.
bindsym $mod+Return exec $term
bindsym $mod+i exec $installer

# Import Sway's display environment before launching the Xwayland installer.
include /etc/sway/config.d/*

exec $installer
