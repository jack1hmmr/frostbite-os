---
modules-search:
  - local

instances:
  - id: frostbite-prepare
    module: shellprocess
    config: shellprocess-prepare.conf
  - id: frostbite-finalize
    module: shellprocess
    config: shellprocess-finalize.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - shellprocess@frostbite-prepare
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - hwclock
      - users
      - shellprocess@frostbite-finalize
      - initcpio
      - services-systemd
      - bootloader
      - umount
  - show:
      - finished

branding: frostbite
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
